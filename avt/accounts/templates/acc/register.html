<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Регистрация</title>
  <style>
    body { font-family: sans-serif; max-width: 360px; margin: 60px auto; padding: 0 16px; }
    label { display: block; margin-top: 14px; font-size: 14px; }
    input { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; }
    button { width: 100%; margin-top: 20px; padding: 10px; cursor: pointer; }
    #message { margin-top: 16px; padding: 10px; border-radius: 4px; display: none; }
    #message.error { display: block; background: #fde8e8; color: #9b1c1c; }
    #message.success { display: block; background: #e6f4ea; color: #1e6b34; }
  </style>
</head>
<body>
  <h1>Регистрация</h1>

  <form id="register-form">
    <label for="name">Имя</label>
    <input id="name" type="text" required maxlength="100">

    <label for="email">Email</label>
    <input id="email" type="email" required>

    <label for="password">Пароль</label>
    <input id="password" type="password" required>

    <label for="password2">Повторите пароль</label>
    <input id="password2" type="password" required>

    <button type="submit">Зарегистрироваться</button>
  </form>

  <div id="message"></div>

  <script>
    //навайбкодил и мне стыдно, будут вопросы - отвечу

const form = document.getElementById("register-form");
    const messageBox = document.getElementById("message");

    function showMessage(text, isError) {
      messageBox.textContent = text;
      messageBox.className = isError ? "error" : "success";
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();   // не даём браузеру отправить форму по-старому

      const data = {
        name: document.getElementById("name").value.trim(),
        email: document.getElementById("email").value.trim(),
        password: document.getElementById("password").value,
      };

      if (data.password !== document.getElementById("password2").value) {
        showMessage("Пароли не совпадают", true);
        return;
      }

      try {
        const response = await fetch("/api/register/", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data),
        });
        const result = await response.json();

        if (response.status === 201) {
          showMessage("Регистрация прошла успешно!", false);
          form.reset();
        } else if (response.status === 400) {
          // DRF отвечает так: {"password": ["текст 1", "текст 2"], "email": ["..."]}
          showMessage(Object.values(result).flat().join(" "), true);
        } else {
          showMessage(result.detail || "Что-то пошло не так", true);
        }
      } catch (error) {
        showMessage("Не удалось связаться с сервером", true);
      }
    });
  </script>
</body>
</html>
